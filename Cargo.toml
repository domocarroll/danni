[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "1.15.0"
authors = ["SUBFRACTURE <team@subfracture.com>"]
license = "Apache-2.0"
repository = "https://github.com/SUBFRACTURE/danni"
description = "A sophisticated AI strategist for creatives, marketers, and designers"

[workspace.lints.clippy]
uninlined_format_args = "allow"
string_slice = "warn"

[workspace.dependencies]
rmcp = { version = "0.9.0", features = ["schemars", "auth"] }

# Patch for Windows cross-compilation issue with crunchy
[patch.crates-io]
crunchy = { git = "https://github.com/nmathewson/crunchy", branch = "cross-compilation-fix" }
