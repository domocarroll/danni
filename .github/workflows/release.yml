name: Build and Release Danni Terminal

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build TUI
        run: |
          cd tui
          GOARCH=arm64 go build -ldflags="-s -w" -o danni-tui cmd/danni-tui/main.go
          mkdir -p ../release/bin
          mv danni-tui ../release/bin/
      - name: Package
        run: |
          cp -r tui/config release/
          cp install-danni-terminal.sh release/install.sh
          cp uninstall-danni-terminal.sh release/uninstall.sh
          cp DANNI_TERMINAL_INSTALL.md release/README.md
          tar -czf danni-terminal-macos-arm64.tar.gz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: danni-terminal-macos-arm64.tar.gz

  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build TUI
        run: |
          cd tui
          CGO_ENABLED=0 go build -ldflags="-s -w" -o danni-tui cmd/danni-tui/main.go
          mkdir -p ../release/bin
          mv danni-tui ../release/bin/
      - name: Package
        run: |
          cp -r tui/config release/
          cp install-danni-terminal.sh release/install.sh
          cp uninstall-danni-terminal.sh release/uninstall.sh
          cp DANNI_TERMINAL_INSTALL.md release/README.md
          tar -czf danni-terminal-linux-x64.tar.gz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: danni-terminal-linux-x64.tar.gz

  create-release:
    needs: [build-macos-arm64, build-linux-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            macos-arm64/*.tar.gz
            linux-x64/*.tar.gz
