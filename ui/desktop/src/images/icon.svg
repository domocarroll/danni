<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Danni signature gradient: Hot Pink to Gold -->
    <linearGradient id="danniGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1493"/>
      <stop offset="50%" stop-color="#FF69B4"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>

    <!-- Subtle stipple pattern inspired by ASCII art -->
    <pattern id="stipple" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1" fill="#ffffff" opacity="0.08"/>
      <circle cx="12" cy="12" r="1" fill="#ffffff" opacity="0.08"/>
      <circle cx="4" cy="12" r="0.5" fill="#ffffff" opacity="0.05"/>
      <circle cx="12" cy="4" r="0.5" fill="#ffffff" opacity="0.05"/>
    </pattern>

    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background with rounded corners -->
  <rect width="512" height="512" rx="115" fill="#0a0a12"/>

  <!-- Stipple texture overlay -->
  <rect width="512" height="512" rx="115" fill="url(#stipple)"/>

  <!-- Elegant feminine profile silhouette - inspired by ASCII portrait -->
  <g filter="url(#glow)">
    <path d="
      M 180 95
      C 200 85, 240 80, 270 90
      C 310 105, 340 140, 355 185
      C 365 215, 365 250, 358 280
      L 372 295
      C 382 308, 380 325, 368 338
      L 352 355
      C 340 372, 328 395, 318 420
      C 310 440, 295 455, 272 458
      C 250 460, 235 450, 225 432
      C 212 408, 205 380, 205 350
      C 205 318, 218 288, 242 265
      C 258 250, 268 230, 270 208
      C 272 180, 262 150, 245 128
      C 228 108, 200 100, 180 95
      Z
    " fill="url(#danniGradient)"/>
  </g>

  <!-- Subtle highlight on forehead/cheek -->
  <ellipse cx="290" cy="180" rx="25" ry="35" fill="#ffffff" opacity="0.08"/>

  <!-- Eye accent dot - consciousness point -->
  <circle cx="310" cy="235" r="6" fill="#FFD700" opacity="0.6"/>

  <!-- Constellation dots - neural network aesthetic -->
  <g opacity="0.4">
    <circle cx="140" cy="140" r="3" fill="#FF69B4"/>
    <circle cx="120" cy="200" r="2" fill="#FFD700"/>
    <circle cx="150" cy="280" r="2.5" fill="#FF69B4"/>
    <circle cx="130" cy="360" r="2" fill="#FFD700"/>
    <circle cx="400" cy="120" r="2" fill="#FFD700"/>
    <circle cx="420" cy="180" r="2.5" fill="#FF69B4"/>
    <circle cx="410" cy="380" r="2" fill="#FF69B4"/>
    <circle cx="380" cy="430" r="3" fill="#FFD700"/>
  </g>
</svg>
