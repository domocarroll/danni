# ✨ DANNI TERMINAL THEME
# Hot Pink + Gold + Black - Sophisticated Luxe Minimalism
# For Ghostty terminal emulator
# https://ghostty.org/docs/config

# === LAUNCH CONFIGURATION ===
# Start Danni TUI automatically
initial-command = danni-tui

# Window title
title = ✨ DANNI

# === COLOR PALETTE ===
# Danni signature colors: Hot Pink (#FF1493) + Gold (#FFD700) + Black (#000000)

# Base colors
background = 000000    # Pure black - sophisticated depth
foreground = ffffff    # Pure white - maximum clarity

# Cursor
cursor-color = ff1493         # Hot pink - bold presence
cursor-style = block
cursor-style-blink = true

# Selection
selection-background = ff1493  # Hot pink
selection-foreground = ffffff  # White

# ANSI Colors (0-15)
# Black
palette = 0=#0a0a0a    # Almost black (soft black)
palette = 8=#404040    # Charcoal gray (bright black)

# Red (mapped to Hot Pink for Danni aesthetic)
palette = 1=#ff1493    # Hot pink - primary accent
palette = 9=#ff007f    # Bright hot pink (rose)

# Green (mapped to Gold for success)
palette = 2=#ffd700    # Gold - success/achievement
palette = 10=#ffa500   # Orange gold - bright variant

# Yellow (Gold shades)
palette = 3=#daa520    # Golden rod - muted gold
palette = 11=#ffd700   # Pure gold - bright

# Blue (Hot Pink shades for consistency)
palette = 4=#ff69b4    # Hot pink alt - softer
palette = 12=#ff1493   # Hot pink - bright

# Magenta (Hot Pink primary)
palette = 5=#ff1493    # Hot pink - primary
palette = 13=#ff69b4   # Hot pink alt (bright magenta)

# Cyan (Gold for secondary accent)
palette = 6=#daa520    # Muted gold
palette = 14=#ffd700   # Bright gold

# White
palette = 7=#cccccc    # Silver/light gray
palette = 15=#ffffff   # Pure white

# === FONT CONFIGURATION ===
font-family = "Berkeley Mono"
font-size = 13
font-feature = -calt  # Disable ligatures for code clarity

# Fallback fonts for symbols
font-family-bold = "Berkeley Mono"
font-family-italic = "Berkeley Mono"
font-family-bold-italic = "Berkeley Mono"

# === WINDOW APPEARANCE ===
window-padding-x = 12
window-padding-y = 12
window-decoration = true
window-theme = dark

# macOS specific
macos-titlebar-style = transparent
macos-option-as-alt = true

# === BEHAVIOR ===
# Scrollback
scrollback-limit = 100000

# Mouse
mouse-hide-while-typing = true
copy-on-select = false

# Shell integration
shell-integration = detect
shell-integration-features = cursor,sudo,title

# === KEYBINDINGS ===
# Danni-optimized shortcuts

# Tab management
keybind = super+t=new_tab
keybind = super+w=close_surface
keybind = super+shift+left_bracket=goto_tab:previous
keybind = super+shift+right_bracket=goto_tab:next

# Split management
keybind = super+d=new_split:right
keybind = super+shift+d=new_split:down
keybind = super+shift+w=close_all_splits

# Navigation
keybind = super+left=goto_split:left
keybind = super+right=goto_split:right
keybind = super+up=goto_split:top
keybind = super+down=goto_split:bottom

# Zoom
keybind = super+equal=increase_font_size:1
keybind = super+minus=decrease_font_size:1
keybind = super+zero=reset_font_size

# === ADVANCED ===
# Performance
clipboard-read = allow
clipboard-write = allow
clipboard-paste-protection = true
clipboard-paste-bracketed-safe = true

# Rendering
# gpu-renderer = auto  # Let Ghostty choose best renderer
